name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  NGSPICE_VERSION: "47"
  KICAD_SYMBOLS_VERSION: "9.0.9"

jobs:
  models:
    name: Validate models (ngspice 47)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Ubuntu's packaged ngspice is older than the 47 the models need
      # (VDMOS), so build the release from source and cache the install.
      - name: Cache ngspice
        id: ngspice-cache
        uses: actions/cache@v4
        with:
          path: ~/ngspice
          key: ngspice-${{ env.NGSPICE_VERSION }}-${{ runner.os }}

      - name: Build ngspice
        if: steps.ngspice-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o ngspice.tar.gz \
            "https://sourceforge.net/projects/ngspice/files/ng-spice-rework/${NGSPICE_VERSION}/ngspice-${NGSPICE_VERSION}.tar.gz/download"
          tar xzf ngspice.tar.gz
          cd "ngspice-${NGSPICE_VERSION}"
          ./configure --prefix="$HOME/ngspice" --disable-debug --with-x=no --without-readline
          make -j"$(nproc)"
          make install

      - name: Put ngspice on PATH
        run: |
          echo "$HOME/ngspice/bin" >> "$GITHUB_PATH"
          echo "NGSPICE=$HOME/ngspice/bin/ngspice" >> "$GITHUB_ENV"

      - name: Show versions
        run: |
          python --version
          ngspice -v | head -n 3

      - name: Validate every model
        run: python tests/validate.py

      - name: Framework tests (includes the mixed-circuit smoke test)
        run: python -m unittest discover tests

  symbols:
    name: KiCad symbols are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The committed symbols come from this kicad-symbols release. Ubuntu's own
      # kicad-symbols package is an older KiCad, so fetch just the five libraries
      # the generator copies from.
      - name: Fetch stock KiCad symbols
        run: |
          git clone --depth 1 --branch "$KICAD_SYMBOLS_VERSION" --filter=blob:none --sparse \
            https://gitlab.com/kicad/libraries/kicad-symbols.git "$RUNNER_TEMP/kicad-symbols"
          git -C "$RUNNER_TEMP/kicad-symbols" sparse-checkout set --no-cone \
            /Device.kicad_sym /Transistor_BJT.kicad_sym /Transistor_FET.kicad_sym \
            /Simulation_SPICE.kicad_sym /Amplifier_Operational.kicad_sym

      - name: Regenerate and compare
        run: python tools/gen_symbols.py --kicad-symbols "$RUNNER_TEMP/kicad-symbols" --check

      - name: Symbol tests (with the stock libraries available)
        run: |
          export KICAD_SYMBOL_DIR="$RUNNER_TEMP/kicad-symbols"
          python -m unittest discover tests -p "test_symbols.py" -v

  package:
    name: Build and check package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build

      - name: Install the wheel and check library_path()
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import re
          from pathlib import Path
          import openjellybean as oj

          p = oj.library_path()
          assert p.is_file(), p
          m = re.search(r"^\* Version (\S+)", p.read_text(), re.M)
          assert m and m.group(1) == oj.__version__, (m and m.group(1), oj.__version__)
          s = oj.symbols_path()
          assert len(list(s.glob("OpenJellybean_*.kicad_sym"))) == 4 and (s / "LICENSE.md").is_file(), s
          print("ok", p, s, oj.__version__)
          PY

      - name: Wheel library and symbols match the root files
        run: |
          python - <<'PY'
          import glob, zipfile
          from pathlib import Path
          z = zipfile.ZipFile(glob.glob("dist/*.whl")[0])
          assert z.read("openjellybean/jellybean.lib") == Path("jellybean.lib").read_bytes()
          symbols = sorted(Path("kicad/symbols").glob("*.kicad_sym"))
          assert len(symbols) == 4, symbols
          for f in symbols:
              assert z.read(f"openjellybean/symbols/{f.name}") == f.read_bytes(), f
          assert z.read("openjellybean/symbols/LICENSE.md") == Path("kicad/LICENSE.md").read_bytes()
          PY

  tag-version:
    name: Tag matches library version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare tag with the jellybean.lib header
        run: |
          tag="${GITHUB_REF_NAME#v}"
          lib="$(sed -n 's/^\* Version \([^[:space:]]*\).*/\1/p' jellybean.lib | head -n 1)"
          echo "tag=$tag header=$lib"
          if [ "$tag" != "$lib" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match '* Version $lib' in jellybean.lib"
            exit 1
          fi
