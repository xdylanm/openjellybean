name: Release

# Publishes to PyPI when a GitHub release is published. Uses PyPI Trusted
# Publishing (OIDC), so no API token is stored in the repository.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Tag must match the jellybean.lib header
        run: |
          tag="${GITHUB_REF_NAME#v}"
          lib="$(sed -n 's/^\* Version \([^[:space:]]*\).*/\1/p' jellybean.lib | head -n 1)"
          echo "tag=$tag header=$lib"
          if [ "$tag" != "$lib" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match '* Version $lib' in jellybean.lib"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/openjellybean/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
