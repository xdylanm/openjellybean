# Metadata for every device in jellybean.lib: what it stands in for, and the datasheet
# values it is checked against by tests/validate.py.
#
# Values and conditions are SI units; magnitudes for PNP / P-channel parts.
# A check passes if the result lies within:
#   typ = X                  X +-10 %
#   typ = X, tol = 0.05      X +-5 %  (widen tol only as far as the fit justifies)
#   min = A and/or max = B   the datasheet's limits, when it gives no typical value
# Run `python tests/validate.py --measures` for the measures and their conditions.

# ---------------------------------------------------------------- BJTs ------
[BC547B_OJ]
kind = "npn"
stand_in_for = ["BC547B"]
source = "BC546/547/548 family datasheets, typical column, group B"
checks = [
  { measure = "hfe", ic = 2e-3, typ = 290 },
  { measure = "hfe", ic = 10e-6, typ = 150 },
  { measure = "vbe", ic = 2e-3, typ = 0.66, tol = 0.03 },
  { measure = "vcesat", ic = 10e-3, ib = 0.5e-3, typ = 0.09, tol = 0.25 },
  { measure = "vcesat", ic = 100e-3, ib = 5e-3, typ = 0.2, tol = 0.2 },
  { measure = "hoe", ic = 2e-3, typ = 30e-6 },
  { measure = "ft", ic = 10e-3, typ = 300e6 },
]

[BC557B_OJ]
kind = "pnp"
stand_in_for = ["BC557B"]
source = "BC556/557/558 family datasheets, typical column, group B"
checks = [
  { measure = "hfe", ic = 2e-3, typ = 290 },
  { measure = "vbe", ic = 2e-3, min = 0.6, max = 0.75 },
  { measure = "vcesat", ic = 10e-3, ib = 0.5e-3, typ = 0.075, tol = 0.2 },
  { measure = "vcesat", ic = 100e-3, ib = 5e-3, typ = 0.25 },
  { measure = "ft", ic = 10e-3, typ = 150e6 },
]

[2N3904_OJ]
kind = "npn"
stand_in_for = ["2N3904", "MMBT3904"]
source = "2N3904 datasheets, min/max limits (no typical column)"
checks = [
  { measure = "hfe", ic = 10e-3, vce = 1, min = 100, max = 300 },
  { measure = "hfe", ic = 1e-3, vce = 1, min = 70 },
  { measure = "hfe", ic = 100e-3, vce = 1, min = 30 },
  { measure = "vcesat", ic = 10e-3, ib = 1e-3, max = 0.2 },
  { measure = "vcesat", ic = 50e-3, ib = 5e-3, max = 0.3 },
  { measure = "vbesat", ic = 10e-3, ib = 1e-3, min = 0.65, max = 0.85 },
  { measure = "ft", ic = 10e-3, vce = 20, f = 100e6, min = 300e6 },
  { measure = "cobo", max = 4e-12 },
  { measure = "cibo", max = 8e-12 },
]

[2N3906_OJ]
kind = "pnp"
stand_in_for = ["2N3906", "MMBT3906"]
source = "2N3906 datasheets, min/max limits (no typical column)"
checks = [
  { measure = "hfe", ic = 10e-3, vce = 1, min = 100, max = 300 },
  { measure = "hfe", ic = 100e-3, vce = 1, min = 30 },
  { measure = "vcesat", ic = 10e-3, ib = 1e-3, max = 0.25 },
  { measure = "vcesat", ic = 50e-3, ib = 5e-3, max = 0.4 },
  { measure = "vbesat", ic = 10e-3, ib = 1e-3, min = 0.65, max = 0.85 },
  { measure = "ft", ic = 10e-3, vce = 20, f = 100e6, min = 250e6 },
  { measure = "cobo", max = 4.5e-12 },
  { measure = "cibo", max = 10e-12 },
]

# ------------------------------------------------------------ MOSFETs -------
[2N7000_OJ]
kind = "nmos"
stand_in_for = ["2N7000", "2N7002", "BS170"]
source = "2N7000 datasheets, typical column"
checks = [
  { measure = "vth", id = 1e-3, typ = 2.1 },
  { measure = "rdson", vgs = 10, id = 0.5, typ = 1.2 },
  { measure = "rdson", vgs = 4.5, id = 75e-3, typ = 1.8, tol = 0.15 },
  { measure = "ciss", typ = 20e-12 },
  { measure = "coss", typ = 11e-12 },
  { measure = "crss", typ = 4e-12, tol = 0.15 },
]

[BS250_OJ]
