# ------------------------------------------------------------- Op-amps ------
[OPAMP_OJ]
kind = "opamp"
params = "VOS=3m"
source = "Parametric: checks the default macromodel and that VOS is honoured"
defaults = { vcc = 15, vee = -15 }
checks = [
  { measure = "aol", typ = 106, tol = 0.02 },
  { measure = "gbw", typ = 2.6e6 },
  { measure = "sr", typ = 13e6 },
  { measure = "vout_max", typ = 13.5, tol = 0.02 },
  { measure = "vout_min", typ = -13.5, tol = 0.02 },
  { measure = "iq", typ = 1.4e-3 },
  { measure = "vos", typ = 3e-3 },
]

[TL07X_OJ]
kind = "opamp"
stand_in_for = ["TL071", "TL072", "TL074"]
source = "TL07x datasheets, typical column at +-15 V"
defaults = { vcc = 15, vee = -15 }
checks = [
  { measure = "aol", typ = 106, tol = 0.02 },
  { measure = "gbw", typ = 3e6 },
  { measure = "pm", min = 45 },
  { measure = "sr", typ = 13e6 },
  { measure = "vout_max", typ = 13.5, tol = 0.02 },
  { measure = "vout_min", typ = -13.5, tol = 0.02 },
  { measure = "iq", typ = 1.4e-3 },
  { measure = "isc", min = 10e-3, max = 60e-3 },
]

[LM358_OJ]
