[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "openjellybean"
dynamic = ["version"]
description = "Generic, original 'jelly bean' SPICE models, packaged for use as a dependency"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "xdylanm" }]
keywords = ["spice", "ngspice", "ltspice", "models", "netlist"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/xdylanm/openjellybean"
Repository = "https://github.com/xdylanm/openjellybean"

# The version lives in exactly one place: the "* Version X.Y.Z" line in the
# header of jellybean.lib. Bump it there and tag the release vX.Y.Z.
[tool.hatch.version]
path = "jellybean.lib"
pattern = '(?m)^\* Version (?P<version>\d+\.\d+\.\d+\S*)\s*$'

[tool.hatch.build.targets.wheel]
packages = ["src/openjellybean"]

[tool.hatch.build.targets.wheel.force-include]
"jellybean.lib" = "openjellybean/jellybean.lib"

[tool.hatch.build.targets.sdist]
include = ["src/openjellybean", "jellybean.lib", "README.md", "LICENSE"]

[tool.hatch.build.targets.sdist.force-include]
"jellybean.lib" = "jellybean.lib"
